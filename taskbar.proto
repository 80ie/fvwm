##  QNX Photon taskbar -- prototype fragment.
##
##  Read into a running fvwm with
##      FvwmCommand 'Read $[FVWM_USERDIR]/taskbar.proto'
##  the same way shelf.proto stages the shelf, so the bar can be lived with
##  before it is folded into config.  config is deliberately untouched: it
##  already has its own uncommitted work wiring FvwmTaskBar up through
##  bin/mk-taskbar (taskbar_height 40, EwmhBaseStruts 0 0 0 taskbar_height),
##  and that is not ours to edit out from under it.  Everything below either
##  overrides one of those two values or replaces module config config itself
##  set, and the whole thing ends by killing and restarting FvwmTaskBar so
##  the overrides actually take -- module config changes never apply
##  retroactively to an already-running instance, only to the next spawn.
##
##  It also re-renders the shelf.  The shelf's height and position (shelf.proto,
##  ShelfMenuRender/ShelfDockRender) are computed from $[infostore.taskbar_height]
##  at the moment they run, not kept in sync afterwards, so changing that value
##  here without telling the shelf to redo its arithmetic leaves a strip of bare
##  desktop where the two used to meet exactly.

##  taskbar_height: InfoStoreAdd on a key that already exists replaces it,
##  it does not shadow or stack, so this is the whole override.  Photon's
##  strip is thinner than the placeholder bar config started from.
InfoStoreAdd taskbar_height 30

##  EwmhBaseStruts has no per-edge update, only a whole-line set, so it has to
##  be reissued in full rather than patched.  Reusing $[infostore.shelf_width]
##  for the right edge is what keeps this from clobbering the shelf's own
##  reservation -- shelf.proto set this same line with the old taskbar_height
##  baked in, and a struts line only takes effect as of when it runs, not
##  when the value it read last changes.
EwmhBaseStruts 0 $[infostore.shelf_width] 0 $[infostore.taskbar_height]

##  Palette: reuse the shelf's colorsets outright instead of minting new
##  ones.  cs_shelf / cs_shelf_hi (30/31) are already the exact face/hover
##  grey Photon uses everywhere, and cs_shelf_well (33) is already the same
##  sunken field the shelf's filler and meters trough use for the clock's
##  background.  Nothing the taskbar draws needs a shade the shelf doesn't
##  already have, so nothing new is allocated in the 38+ range.

##  TaskBarIcons (the FvwmIconMan window list) -- recoloured from the brown
##  Colorset 10/11/12/14 config set, to Photon grey.  These are scalar
##  options, so restating them is enough to override; unlike FvwmTaskBar's
##  cell list below they do not accumulate, so no DestroyModuleConfig is
##  needed first.  Bevel keywords (PlainButton up, IconButton sunkedge,
##  IconAndSelectButton down, SelectButton up) are left exactly as config set
##  them -- they are what actually draws the 3D relief, and Photon's relief
##  is the same shape as the brown taskbar's, only in the soft grey/white/
##  #a7a7a7 triad instead of the rust one, so recolouring is all that is
##  needed, not restructuring.
*TaskBarIcons: Colorset               $[infostore.cs_shelf]
*TaskBarIcons: PlainColorset          $[infostore.cs_shelf]
*TaskBarIcons: FocusColorset          $[infostore.cs_shelf]
*TaskBarIcons: FocusAndSelectColorset $[infostore.cs_shelf_hi]
*TaskBarIcons: SelectColorset         $[infostore.cs_shelf_hi]
*TaskBarIcons: IconAndSelectColorset  $[infostore.cs_shelf_hi]
*TaskBarIcons: IconColorset           $[infostore.cs_shelf]
##  Font too, not just the colours.  config sets Cormorant Bold Italic here
##  to match the warm brown theme; left alone it renders the window buttons in
##  a bold italic serif directly beside the Launch button's plain sans, which
##  reads as two themes sharing one bar.  Photon's window buttons are the same
##  small sans as everything else.
*TaskBarIcons: Font $[infostore.shelf_font]
##  ButtonGeometry's height has to track the new taskbar_height, and a plain
##  "*Module: option" line does not expand $[...] -- the same trap
##  mk-taskbar's own Geometry line documents -- so it goes through PipeRead
##  instead, which expands $[...] in the echoed command before fvwm ever sees
##  the literal "*TaskBarIcons:" line it produces.
PipeRead "echo '*TaskBarIcons: ButtonGeometry 120x$[infostore.taskbar_height]'"

##  FvwmTaskBar itself.  DestroyModuleConfig first: mk-taskbar's cell lines
##  are plain "(...)" appends with nothing keying them to a slot, so reading
##  them a second time without a Destroy between would stack the new cells
##  after the old ones instead of replacing them (mk-shelf hits the same
##  issue and self-destroys on every render for the same reason). The
##  module-wide preamble (Colorset/ActiveColorset/Frame/Font) is config's own
##  three lines, just recoloured and given the shelf's font; mk-taskbar has
##  no preamble syntax of its own the way mk-shelf's spec does, so it is
##  written here directly instead of through taskbar.items.
DestroyModuleConfig FvwmTaskBar:*
*FvwmTaskBar: Colorset       $[infostore.cs_shelf]
*FvwmTaskBar: ActiveColorset $[infostore.cs_shelf_hi]
*FvwmTaskBar: Frame 0
*FvwmTaskBar: Font $[infostore.shelf_font]
PipeRead "$[FVWM_USERDIR]/bin/mk-taskbar $[FVWM_USERDIR]/taskbar.items \
    FvwmTaskBar $[vp.width] $[infostore.taskbar_height]"

##  TaskbarClockTick pushes the time into the cell taskbar.items names
##  "TaskbarClock" via Id, using FvwmButtons' own SendToModule/ChangeButton
##  rather than a Swallow(ed) FvwmScript -- that is what lets the clock read
##  as one flush sunken field, "Fri-19 11:33PM", instead of FvwmScript-
##  DateTime's own two-line HH:MM / date pair in its own window chrome. date's
##  own tokens spell Photon's exact format: %a-%d is "Fri-19", %I:%M%p is
##  "11:33PM" (GNU date's %p is already uppercase).
DestroyFunc TaskbarClockTick
AddToFunc   TaskbarClockTick
+ I PipeRead "date '+SendToModule FvwmTaskBar ChangeButton TaskbarClock Title \"%a-%d %I:%M%p\"'"

##  Kill before start, never overlap.  FvwmTaskBar swallows stalonetray with
##  Swallow(NoClose,UseOld); overlapping two instances of a window that holds
##  a NoClose swallow is exactly what stranded a duplicate pager for the
##  shelf, so this follows mk-shelf --static's order (kill, then Schedule the
##  replacement) rather than the double-buffered accordion's.  There is only
##  one FvwmTaskBar, so there is no second alias to swap to.
KillModule FvwmButtons FvwmTaskBar
Schedule 150 Module FvwmButtons FvwmTaskBar

##  First tick shortly after the bar reappears (empty until then), then keep
##  it current.  Two attempts, not one: a single shot at 300ms occasionally
##  lands before FvwmIconMan/FvwmButtons have finished coming up, and
##  SendToModule to a button that does not exist yet is silently dropped, not
##  queued -- measured as a clock that stayed blank until the next 30s tick.
##  Periodic's id (3010) just has to not collide with config's own
##  "5minutes" schedule (1222); re-running this Schedule Periodic line on a
##  later re-Read of this file replaces the existing timer under that id
##  rather than stacking a second one.
Schedule 300 TaskbarClockTick
Schedule 1200 TaskbarClockTick
Schedule Periodic 30000 3010 TaskbarClockTick

##  Re-snap the shelf to the new boundary (see the note at the top).  Dock
##  first, same as shelf.proto's own startup order, because it publishes
##  shelf_dock_h and the menu's height is computed from that.
ShelfDockRender
ShelfMenuRender
