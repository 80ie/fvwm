# Rendered by bin/palette, never by a bare `wallust` run: palette renders
# into a scratch dir and copies over these targets only on `apply`.
[templates]
fvwm = { template = "colorsets", target = "~/.fvwm/colorsets" }
qt5ct = { template = "qt5ct.conf", target = "~/.config/qt5ct/colors/wallust.conf" }
qt6ct = { template = "qt6ct.conf", target = "~/.config/qt6ct/colors/wallust.conf" }
kde = { template = "kde.colors", target = "~/.local/share/color-schemes/Wallust.colors" }
gtk3 = { template = "gtk3.css", target = "~/.themes/Redmond97 Deer/gtk-3.0/gtk.css" }
gtk4 = { template = "gtk4.css", target = "~/.config/gtk-4.0/gtk.css" }
kitty = { template = "kitty.conf", target = "~/.config/kitty/current-theme.conf" }
xresources = { template = "Xresources", target = "~/.cache/palette/Xresources" }
stalonetray = { template = "stalonetrayrc", target = "~/.fvwm/stalonetrayrc" }
